name: Build Windows desktop app

# Manual only: builds the Ember Arena Windows x64 NSIS installer from desktop/, publishes
# it as a GitHub release asset (tag windows-v<version>) and uploads a workflow artifact.
# Uses no secrets beyond the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NSIS installer (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      # Never let electron-builder try to publish anywhere.
      EB_PUBLISH: never
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Decode binary assets
        run: node scripts/decode-assets.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check, build and package
        run: bun run dist:win

      - name: Publish GitHub release
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="windows-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe release/*.exe.blockmap --clobber
          else
            gh release create "$TAG" release/*.exe release/*.exe.blockmap \
              --title "Ember Arena for Windows $VERSION" \
              --notes "Windows 10/11 x64 installer. Unsigned build - SmartScreen may warn on first run (More info > Run anyway). Uses the same accounts and backend as the Android app."
          fi
          echo "Published release $TAG"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberArena-Windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

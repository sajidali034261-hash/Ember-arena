name: Build Windows desktop app

# Manual only: builds the Ember Arena Windows x64 NSIS installer from desktop/ and
# uploads it as a workflow artifact. It never publishes a GitHub release and uses no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NSIS installer (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      # Never let electron-builder try to publish anywhere.
      EB_PUBLISH: never
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Decode binary assets
        run: node scripts/decode-assets.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check, build and package
        run: bun run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberArena-Windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14
